name: Convert images

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force rebuild all images from scratch"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  convert:
    runs-on: blacksmith-32vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-tools libjxl-tools libavif-bin webp jq xxd

      - name: Verify tools
        run: |
          vips --version
          vipsheader --version || true
          cjxl --version
          avifenc --version
          cwebp -version
          jq --version

      - name: Restore existing built assets from dist
        id: restore
        env:
          COMMIT_MESSAGES: ${{ join(github.event.commits.*.message, ' ') }}
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          commit_msg="${COMMIT_MESSAGES:-${HEAD_COMMIT_MSG:-$(git log -1 --pretty=%B 2>/dev/null || echo '')}}"
          if [ "${{ github.event.inputs.force_rebuild }}" = "true" ] || echo "$commit_msg" | grep -qi '\[clear\]'; then
            echo "Force rebuild requested ([clear] or force_rebuild); skipping dist cache restore."
            echo "has_dist=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --exit-code --heads origin dist >/dev/null 2>&1; then
            echo "Fetching existing dist branch..."
            git fetch origin dist --depth=1
            git checkout FETCH_HEAD -- avif jpg webp jxl 2>/dev/null || true
            echo "has_dist=true" >> "$GITHUB_OUTPUT"
          else
            echo "Remote dist branch does not exist yet."
            echo "has_dist=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Convert images
        env:
          COMMIT_MESSAGES: ${{ join(github.event.commits.*.message, ' ') }}
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
          FORCE_INPUT: ${{ github.event.inputs.force_rebuild }}
        run: |
          commit_msg="${COMMIT_MESSAGES:-${HEAD_COMMIT_MSG:-$(git log -1 --pretty=%B 2>/dev/null || echo '')}}"
          if [ "$FORCE_INPUT" = "true" ] || echo "$commit_msg" | grep -qi '\[clear\]'; then
            export FORCE=1
          fi
          chmod +x convert.sh
          ./convert.sh

      - name: Commit and push orphan dist branch
        run: |
          git config user.name "IsraelGPT"
          git config user.email "trackers@artistgrid.cx"

          # Switch to an orphan branch without history so dist only ever has 1 commit (shallow)
          git checkout main 2>/dev/null || true
          git branch -D dist 2>/dev/null || true
          git checkout --orphan dist
          git rm -rf --cached . >/dev/null 2>&1 || true

          # Stage distribution files and directories
          git add -f index.json index.html 404.html og/ avif/ jpg/ webp/ jxl/

          # If dist already exists remotely, verify if there are any changes
          if [ "${{ steps.restore.outputs.has_dist }}" = "true" ]; then
            current_tree="$(git write-tree)"
            remote_tree="$(git rev-parse FETCH_HEAD^{tree})"
            if [ "$current_tree" = "$remote_tree" ]; then
              echo "No changes in built assets compared to existing dist branch. Skipping push."
              exit 0
            fi
          fi

          git commit -m "[ci] Convert images to avif/jpg/webp/jxl (500x500)"

          # Ensure the commit is a root commit with 0 parents (shallow, 1 commit only)
          parents=$(git rev-list --parents -n 1 HEAD | awk '{$1=""; print $0}')
          if [ -n "$parents" ]; then
            echo "ERROR: dist branch commit must not have parents!" >&2
            exit 1
          fi

          git push -f origin HEAD:refs/heads/dist
